name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          unzip -q IPhoneCam.zip
          cd IPhoneCam
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: iCam-apk
          path: IPhoneCam/app/build/outputs/apk/debug/app-debug.apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v${{ github.run_number }} IPhoneCam/app/build/outputs/apk/debug/app-debug.apk --title "iCam ${{ github.run_number }}" --notes "APK"
